name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up GCC
        uses: bwoodsend/setup-winlibs-action@v1

      - name: Download Chinese font
        shell: pwsh
        run: |
          # 直接从Windows系统复制微软雅黑字体
          $fontSrc = "C:\Windows\Fonts\msyh.ttc"
          $fontDst = "${{ github.workspace }}\assets\fonts"
          New-Item -ItemType Directory -Force -Path $fontDst
          Copy-Item $fontSrc "$fontDst\msyh.ttc"
          Write-Host "Font copied: $(Get-Item "$fontDst\msyh.ttc" | Select-Object -ExpandProperty Length) bytes"

      - name: Install dependencies
        run: go mod tidy

      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -ldflags "-s -w -H windowsgui" -o legend-drop-tool.exe ./cmd/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: legend-drop-tool-windows-amd64
          path: legend-drop-tool.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: legend-drop-tool-windows-amd64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: legend-drop-tool.exe
          generate_release_notes: true
